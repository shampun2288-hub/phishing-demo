<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проверка безопасности аккаунта</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
        margin: 0;
      }
      .card {
        background: #fff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        max-width: 420px;
        text-align: center;
      }
      button {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
      }
      button:hover { background: #1d4ed8; }
      #result { margin-top: 1rem; font-weight: bold; }
      .notice {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #666;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Проверка безопасности аккаунта</h1>
      <p>Ваш аккаунт требует дополнительной проверки безопасности.</p>
      <button id="check-btn">Проверить</button>
      <p id="result"></p>

      <div class="notice">
        ℹ️ Это учебная демонстрация фишинговой страницы для доклада о мошенничестве.
        Никакие личные данные не собираются: фиксируется только обезличенная
        статистика — количество открытий страницы и нажатий на кнопку.
      </div>
    </div>

    <script>
      const SUPABASE_URL = 'https://hczktrehwxufbidacgpq.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NfHUJ7LhoDvT-_GCZKzd8w_eZtSXv80';

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // UUID посетителя: один раз создаётся и хранится в localStorage.
      // Повторное открытие страницы тем же браузером не добавит нового посетителя.
      function getVisitorId() {
        let id = localStorage.getItem('demo_visitor_id');
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem('demo_visitor_id', id);
        }
        return id;
      }

      async function trackEvent(event) {
        try {
          await sb.rpc('track_demo', {
            p_visitor_id: getVisitorId(),
            p_event: event
          });
        } catch (e) {
          console.error('Ошибка отправки события:', e);
        }
      }

      // Обработчик кнопки вешаем сразу, чтобы демо работало
      // даже если статистика по какой-то причине недоступна
      document.getElementById('check-btn').addEventListener('click', async () => {
        document.getElementById('result').textContent =
          'Благодарю за статистику от Шамиля ❤️';
        await trackEvent('click');
      });

      // Фиксируем открытие страницы
      trackEvent('open');
    </script>
  </body>
</html>
